name: Android quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: android-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify Android app
        run: ./gradlew test lint assembleDebug
      - name: Verify changelog
        run: ./scripts/check-changelog.sh
